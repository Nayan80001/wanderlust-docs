site_name: Wanderlust | Project guide
site_description: A clear overview of the Wanderlust application, its AWS architecture, and how changes reach users.
site_url: https://nayan80001.github.io/wanderlust-docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: teal
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Overview: index.md
  - Architecture:
      - AWS and Kubernetes: architecture.md
      - Technology stack: technology-stack.md
      - Infrastructure: infrastructure.md
      - Configuration and access: host-configuration.md
  - Delivery:
      - The five repositories: repositories.md
      - Local development: local-development.md
      - Jenkins checks: ci.md
      - Release and GitOps: cd-gitops.md
  - Operations:
      - Monitoring: monitoring.md
      - Runbook and costs: operations.md
  - Glossary: glossary.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.1.0/dist/mermaid.min.js
  - assets/javascripts/mermaid-init.js

extra_css:
  - assets/stylesheets/overrides.css

strict: true
